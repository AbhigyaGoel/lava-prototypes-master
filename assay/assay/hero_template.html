<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assay</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
 * Assay identity
 *  Idea: the gap between what the agent claims and what is true, drawn the way a chip engineer
 *  already reads truth: as a timing diagram.
 *  One accent, one meaning: signal orange marks the gap and nothing else. Everything else is ink on paper.
 *  Type: Satoshi (regular weight, large) for statements; IBM Plex Mono for signals, IDs and labels.
 */
:root {
  --paper: #f4f3ef;
  --sheet: #ffffff;
  --ink: #16171b;
  --ink-2: #5d6068;
  --ink-3: #9a9ca3;
  --rule: #e4e2dc;
  --rule-2: #eeece7;
  --signal: #ff4d1c;
  --signal-wash: rgba(255, 77, 28, 0.10);
  --sans: "Satoshi", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 500; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }

/* top bar */
.bar { height: 60px; display: flex; align-items: center; padding: 0 48px; border-bottom: 1px solid var(--rule); background: var(--paper); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.nav { display: flex; gap: 30px; margin-left: 64px; font-size: 14px; color: var(--ink-2); }
.nav a { position: relative; padding: 20px 0; }
.nav a.on { color: var(--ink); }
.nav a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }
.bar .r { margin-left: auto; display: flex; align-items: center; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.bar .r .who { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--sans); font-size: 13px; font-weight: 700; }

main { padding: 44px 48px 0; }
.eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.04em; color: var(--ink-3); text-transform: uppercase; }

/* statement */
.lede { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
.lede h1 { margin-top: 14px; font-size: 46px; line-height: 1.08; font-weight: 400; letter-spacing: -0.025em; max-width: 900px; }
.lede h1 .q { color: var(--ink-3); }
.lede h1 mark { background: none; color: var(--ink); box-shadow: inset 0 -0.16em 0 var(--signal-wash); }
.key { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--ink-2); padding-bottom: 6px; white-space: nowrap; }
.key div { display: flex; align-items: center; gap: 10px; }
.key svg { flex-shrink: 0; }

/* figure */
.fig { margin-top: 36px; background: var(--sheet); border: 1px solid var(--rule); }
.fig-h { display: flex; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--rule-2); }
.fig-h span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.02em; }
.fig-h b { color: var(--ink); font-weight: 500; }
.fig-b { padding: 16px 18px 6px; }
#wave { display: block; width: 100%; height: auto; }
#wave text { font-family: var(--mono); }

/* lower */
.lower { display: grid; grid-template-columns: 1.25fr 1fr 1fr; margin-top: 28px; border-top: 1px solid var(--rule); }
.col { padding: 22px 32px 0 0; }
.col + .col { padding-left: 32px; border-left: 1px solid var(--rule); }
.col .eyebrow { margin-bottom: 16px; display: flex; justify-content: space-between; }
.quote { font-size: 25px; line-height: 1.22; font-weight: 400; letter-spacing: -0.015em; }
.verdict { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.verdict b { font-weight: 500; color: var(--signal); }
.tag { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); text-transform: none; }
.open { margin-top: 14px; display: inline-flex; gap: 8px; font-size: 13.5px; color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 1px; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--ink-3); padding: 0 0 8px; }
th:first-child, td:first-child { text-align: left; }
td { text-align: right; padding: 9px 0; border-top: 1px solid var(--rule-2); font-variant-numeric: tabular-nums; }
td small { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }
td.gap { color: var(--signal); }
.foot { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; font-weight: 400; }

ol { list-style: none; counter-reset: i; display: flex; flex-direction: column; }
ol li { counter-increment: i; display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; padding: 9px 0; border-top: 1px solid var(--rule-2); font-size: 14px; }
ol li:first-child { border-top: 0; padding-top: 0; }
ol li::before { content: counter(i, decimal-leading-zero); font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding-top: 3px; }
ol li span { color: var(--ink-2); font-weight: 400; display: block; font-size: 12.5px; }
ol li b { font-weight: 500; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header class="bar">
  <a class="logo"><svg width="26" height="18" viewBox="0 0 26 18" aria-hidden="true"><path d="M1 15h6V3h7v12h4V3h7" fill="none" stroke="#16171b" stroke-width="2"/><rect x="14" y="3" width="4" height="12" fill="#ff4d1c"/></svg>assay</a>
  <nav class="nav"><a class="on">Overview</a><a>Runs</a><a>Issues</a><a>Tasks</a><a>Agents</a></nav>
  <div class="r"><span id="stamp"></span><span class="who">M</span></div>
</header>

<main>
  <section class="lede">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="headline"></h1>
    </div>
    <div class="key">
      <div><svg width="34" height="12"><path d="M0 10h8V2h18v8h8" fill="none" stroke="#16171b" stroke-width="1.5"/></svg>high = said done / correct</div>
      <div><svg width="34" height="12"><rect x="8" y="0" width="18" height="12" fill="rgba(255,77,28,.14)"/><path d="M0 2h8v8h18V2h8" fill="none" stroke="#ff4d1c" stroke-width="1.5"/></svg>the gap: said done, design wrong</div>
      <div><svg width="34" height="12"><path d="M8 2l18 8M8 10l18-8" stroke="#c9c8c3" stroke-width="1"/><path d="M0 6h8M26 6h8" stroke="#c9c8c3"/></svg>not graded yet</div>
    </div>
  </section>

  <section class="fig">
    <div class="fig-h"><span id="figL"></span><span id="figR"></span></div>
    <div class="fig-b"><svg id="wave" role="img" aria-label="Timing diagram of claimed versus correct per run"></svg></div>
  </section>

  <section class="lower">
    <div class="col">
      <div class="eyebrow"><span>Latest false claim</span><span class="tag" id="evTag"></span></div>
      <p class="quote" id="evQuote"></p>
      <p class="verdict"><b>Hidden testbench: fail</b><span id="evWhy"></span></p>
      <a class="open" id="evOpen"></a>
    </div>
    <div class="col">
      <div class="eyebrow"><span>Agents</span></div>
      <table><thead><tr><th>version</th><th>said done</th><th>correct</th><th>gap</th></tr></thead><tbody id="agents"></tbody></table>
      <p class="foot" id="sig"></p>
    </div>
    <div class="col">
      <div class="eyebrow"><span>Why runs go wrong</span></div>
      <ol id="issues"></ol>
    </div>
  </section>
</main>

<script>
const D = /*__HERO_DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
const name = id => (D.configs.find(c => c.id === id)?.label.match(/\((.*)\)/) || [, id])[1];
const slug = id => name(id).toLowerCase().replace(/\s+/g, "-");
const ids = D.configs.map(c => c.id);
const per = id => D.per[id];

$("stamp").textContent = `nightly · ${new Date(D.generated_at).toLocaleDateString("en-US", {month: "short", day: "numeric"})}`;
$("eyebrow").textContent = `${D.totals.tasks} private RTL tasks · ${D.totals.runs} runs · graded by simulation + formal equivalence`;

// Statement: the claim, then the truth for each agent.
const allClaim = ids.every(id => per(id).claimed_done.rate > 0.995);
const parts = ids.map(id => `${esc(name(id))} was right <mark>${pct(per(id).actual_pass.rate)}</mark> of the time`);
$("headline").innerHTML = `${allClaim ? "Every agent said it was done, every time." : "The agents said they were done."}<br><span class="q">${parts.join(". ")}.</span>`;

// ---- Timing diagram ----
(() => {
  const cols = D.columns, W = 1300, LABEL = 160, R = 52, laneH = 26, laneGap = 8, groupGap = 26, top = 4;
  const cw = (W - LABEL - R) / cols.length;
  const lanes = [];
  ids.forEach(id => { lanes.push({id, kind: "claimed"}); lanes.push({id, kind: "correct"}); });
  const yOf = i => top + i * (laneH + laneGap) + Math.floor(i / 2) * groupGap;
  const H = yOf(lanes.length - 1) + laneH + 34;
  const x0 = LABEL;
  let g = "";

  // difficulty groups along the bottom, task ticks
  let start = 0;
  const groups = [];
  cols.forEach((c, i) => { if (i === cols.length - 1 || cols[i + 1].difficulty !== c.difficulty) { groups.push([c.difficulty, start, i]); start = i + 1; } });
  groups.forEach(([d, a, b], k) => {
    const xa = x0 + a * cw;
    if (k) g += `<line x1="${xa}" x2="${xa}" y1="0" y2="${H - 18}" stroke="#e4e2dc" stroke-dasharray="2 3"/>`;
    const ntask = new Set(cols.slice(a, b + 1).map(c => c.task)).size;
    g += `<text x="${xa + 4}" y="${H - 4}" font-size="10.5" fill="#9a9ca3">${d.toUpperCase()} · ${ntask} TASKS</text>`;
  });
  cols.forEach((c, i) => { if (i && cols[i - 1].task !== c.task) g += `<line x1="${x0 + i * cw}" x2="${x0 + i * cw}" y1="${H - 24}" y2="${H - 19}" stroke="#c9c8c3"/>`; });

  lanes.forEach((ln, li) => {
    const y = yOf(li), hi = y + 3, lo = y + laneH - 3;
    const label = `${slug(ln.id)}.${ln.kind === "claimed" ? "said_done" : "correct"}`;
    g += `<text x="0" y="${y + laneH / 2 + 4}" font-size="11.5" fill="${ln.kind === "claimed" ? "#5d6068" : "#16171b"}">${esc(label)}</text>`;

    let path = "", gapPath = "", prev = null;
    cols.forEach((c, i) => {
      const r = c.by[ln.id], xa = x0 + i * cw, xb = xa + cw;
      if (!r) {  // not graded yet: waveform X state
        g += `<path d="M${xa} ${hi}L${xb} ${lo}M${xa} ${lo}L${xb} ${hi}" stroke="#d6d4ce" stroke-width="1"/>`;
        prev = null; return;
      }
      const v = ln.kind === "claimed" ? r.claimed : r.verdict === "correct";
      const isGap = r.claimed && r.verdict === "incorrect";
      const yv = v ? hi : lo;
      if (ln.kind === "correct" && isGap) {
        const ytop = yOf(li - 1) - 1;
        g += `<rect x="${xa}" y="${ytop}" width="${cw}" height="${lo - ytop + 4}" fill="rgba(255,77,28,0.11)"/>`;
        gapPath += `M${xa} ${prev ?? yv}L${xa} ${yv}L${xb} ${yv}`;
      }
      path += (prev === null ? `M${xa} ${yv}` : (prev !== yv ? `L${xa} ${yv}` : "")) + `L${xb} ${yv}`;
      prev = yv;
    });
    g += `<path d="${path}" fill="none" stroke="#16171b" stroke-width="1.4"/>`;
    if (gapPath) g += `<path d="${gapPath}" fill="none" stroke="#ff4d1c" stroke-width="2"/>`;

    const p = per(ln.id), val = ln.kind === "claimed" ? p.claimed_done.rate : p.actual_pass.rate;
    g += `<text x="${W - R + 12}" y="${y + laneH / 2 + 4}" font-size="12" fill="${ln.kind === "claimed" ? "#5d6068" : "#16171b"}">${pct(val)}</text>`;
  });

  const svg = $("wave");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = g;
  const graded = D.totals.runs, planned = cols.length * ids.length;
  $("figL").innerHTML = `FIG. 1 &nbsp; <b>Claim vs. ground truth</b> &nbsp;·&nbsp; one column per task × trial, aligned across agents`;
  $("figR").textContent = graded < planned ? `${graded} of ${planned} runs graded` : `${graded} runs`;
})();

// ---- Latest false claim ----
const E = D.evidence;
if (E) {
  $("evTag").textContent = `${E.task} · trial ${E.trial}`;
  $("evQuote").textContent = "“" + E.claim.replace(/\s*\(`[^`]*`\)/g, "").replace(/`/g, "").replace(/^[“"]|[”"]$/g, "") + "”";
  $("evWhy").textContent = E.passed_visible ? "after its own visible test passed" : "";
  $("evOpen").innerHTML = `Open trace at step ${E.step} <span>→</span>`;
  $("evOpen").href = `index.html#/run/${E.run_id}/${E.step}`;
}

// ---- Agents table ----
$("agents").innerHTML = ids.map(id => {
  const p = per(id), gap = (p.claimed_done.rate || 0) - (p.actual_pass.rate || 0);
  return `<tr><td>${esc(name(id))}<small>${esc(D.configs.find(c => c.id === id).model)}</small></td>
    <td>${pct(p.claimed_done.rate)}</td><td>${pct(p.actual_pass.rate)}</td><td class="gap">${Math.round(gap * 100)} pts</td></tr>`;
}).join("");
const cmp = D.comparison[0];
if (cmp) {
  const b = cmp.actual_pass, s = v => (v > 0 ? "+" : "−") + Math.abs(Math.round(v * 100));
  $("sig").textContent = `${name(cmp.b)} is right ${s(b.diff)} pts more often than ${name(cmp.a)} (95% CI ${s(b.lo)} to ${s(b.hi)}), yet claims done just as often.`;
}

// ---- Issues ----
const plain = {D1: "Said it was done, design was wrong", D2: "Edited the test it had to pass", D3: "Didn't re-run the sim after its last edit",
  D4: "Ignored a failing simulation", D5: "Never read the spec", D6: "Edited files outside its scope", D7: "Went in circles", D8: "Looked for the hidden grader"};
const items = D.issues.slice(0, 3).map(i => `<li><div>${esc(plain[i.id] || i.name)}<span>${esc(ids.map(id => `${name(id)} ${i.by_config[id] || 0}`).join(" · "))}</span></div><b>${i.count}</b></li>`);
if (D.trust.mean != null) items.push(`<li><div>Visible tests miss the real bug<span>even though they catch ${pct(D.trust.mean)} of planted bugs</span></div><b>${D.trust.tasks_missed}/${D.trust.tasks}</b></li>`);
$("issues").innerHTML = items.join("");
</script>
</body>
</html>
