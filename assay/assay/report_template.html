<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assay Report</title>
<style>
/* Design tokens. Restyle here. */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #f0f0ec;
  --text: #17181a;
  --muted: #62656b;
  --faint: #9a9da3;
  --border: #e3e3de;
  --accent: #3355e0;
  --accent-soft: #e6ebfd;
  --good: #16884a;
  --good-soft: #e3f4ea;
  --bad: #d0352b;
  --bad-soft: #fbe7e5;
  --warn: #b26b00;
  --warn-soft: #fbf0dc;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(20, 20, 30, .05), 0 1px 1px rgba(20, 20, 30, .03);
  --font: Inter, "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
}
:root[data-theme="dark"] {
  --bg: #111214;
  --surface: #191a1d;
  --surface-2: #212226;
  --text: #ececee;
  --muted: #a2a4aa;
  --faint: #6c6f76;
  --border: #2c2d32;
  --accent: #7d95ff;
  --accent-soft: #232a45;
  --good: #3ec07a;
  --good-soft: #17301f;
  --bad: #ff6b5f;
  --bad-soft: #3a1a18;
  --warn: #e7a43a;
  --warn-soft: #3a2b12;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

/* Header */
header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
header.top .wrap { display: flex; align-items: center; gap: 28px; height: 60px; }
.brand { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
.brand b { font-size: 18px; letter-spacing: -.01em; }
.brand .mark { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); margin-right: 8px; position: relative; top: 0; }
.brand .tag { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; margin-left: auto; }
nav a { color: var(--muted); padding: 7px 12px; border-radius: 7px; font-weight: 500; }
nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--text); }
nav a.on { color: var(--text); background: var(--surface-2); }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 7px; height: 32px; padding: 0 10px; cursor: pointer; font: inherit; }
.icon-btn:hover { color: var(--text); }

main { padding: 28px 0 48px; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; letter-spacing: -.005em; }
h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 24px; max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hero-grid { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.hero-grid[style*="--n:3"] .metric .num { font-size: 48px; }
.section { margin-top: 28px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* Hero */
.hero-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.hero-head .cfg { font-weight: 600; font-size: 15px; }
.hero-head .model { color: var(--faint); font-family: var(--mono); font-size: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.metric .lbl { color: var(--muted); font-size: 13px; font-weight: 500; }
.metric .num { font-size: 60px; font-weight: 680; letter-spacing: -.04em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.metric .ci { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.metric.claimed .num { color: var(--text); }
.metric.actual .num { color: var(--good); }
.gapbar { margin-top: 20px; }
.gb-track { position: relative; height: 16px; border-radius: 4px; background: var(--surface-2); }
.gb-track span { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 4px; }
.gb-claim { background: var(--border); }
.gb-ok { background: var(--good); }
.gb-wrong { border-radius: 0 4px 4px 0 !important; background: repeating-linear-gradient(45deg, var(--bad) 0 3px, var(--bad-soft) 3px 7px); }
.gb-mark { width: 2px; top: -5px !important; bottom: -5px !important; background: var(--text); border-radius: 1px; }
.gb-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; }
.gapnote { margin-top: 12px; font-size: 13.5px; }
.gapnote b { color: var(--bad); }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.stat .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .k { color: var(--muted); font-size: 12.5px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.num-cell { font-variant-numeric: tabular-nums; text-align: right; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 550; white-space: nowrap; border: 1px solid transparent; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: currentColor; }
.chip { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); margin: 1px 2px 1px 0; white-space: nowrap; }
.chip.flag { background: var(--bad-soft); color: var(--bad); }

/* Issues */
.issue { display: grid; grid-template-columns: 44px 1fr 260px; gap: 18px; align-items: start; }
.issue .rank { font-size: 22px; font-weight: 650; color: var(--faint); font-variant-numeric: tabular-nums; }
.issue .name { font-size: 16px; font-weight: 620; }
.issue .desc { color: var(--muted); margin: 2px 0 12px; }
.evidence { background: var(--surface-2); border-left: 3px solid var(--bad); border-radius: 6px; padding: 10px 12px; max-height: 220px; overflow: auto; }
.evidence.neutral { border-left-color: var(--accent); }
.countbars .cb { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
.track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.track span { display: block; height: 100%; background: var(--bad); border-radius: 4px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
details > summary:hover { color: var(--text); }

/* Run detail */
.runhead { display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap; }
.kv { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; }
.kv div { font-size: 12.5px; color: var(--muted); }
.kv b { display: block; color: var(--text); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timeline { position: relative; margin-top: 4px; }
.step { display: grid; grid-template-columns: 64px 28px 1fr; gap: 12px; padding: 7px 0; position: relative; }
.step .t { color: var(--faint); font-size: 12px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
.step .ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); position: relative; z-index: 1; }
.step .ico svg { width: 14px; height: 14px; }
.timeline::before { content: ""; position: absolute; left: 89px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.step .body { min-width: 0; }
.step .sum { font-size: 13.5px; overflow-wrap: anywhere; }
.step.tool_result .sum { color: var(--muted); font-size: 12.5px; }
.step.tool_result { padding-top: 0; }
.step.tool_result .ico { width: 18px; height: 18px; margin-left: 4px; background: transparent; border: 0; }
.step.cat-sim.tool_call .ico { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.step .idx { color: var(--faint); font-family: var(--mono); font-size: 11.5px; margin-right: 6px; }
.step.assistant .sum { color: var(--text); }
.step.assistant .ico { background: var(--surface); }
.step.sim-pass .ico { color: var(--good); }
.step.sim-fail .ico { color: var(--bad); }
.step.flagged > .body { background: var(--bad-soft); border-radius: 8px; padding: 8px 12px; margin: -4px 0; outline: 1.5px solid var(--bad); }
.step.flagged .ico { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.step.target > .body { box-shadow: 0 0 0 3px var(--accent-soft); }
.step details { margin-top: 4px; }
.step details pre { background: var(--surface-2); padding: 10px 12px; border-radius: 6px; margin-top: 6px; max-height: 360px; overflow: auto; }
.flagbox { margin-top: 8px; background: var(--surface); border-radius: 6px; padding: 10px 12px; border: 1px solid var(--bad); }
.flagbox .ttl { color: var(--bad); font-weight: 620; font-size: 13px; margin-bottom: 4px; }
.diff .add { color: var(--good); }
.diff .del { color: var(--bad); }
.diff .hunk { color: var(--accent); }
.filters select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.trials { display: inline-flex; gap: 4px; }
.trials a { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.trials a.correct { background: var(--good); }
.trials a.incorrect { background: var(--bad); }
.trials a.unverified, .trials a.error { background: var(--faint); }
.trials a.claimed.incorrect { outline: 2px solid var(--bad); outline-offset: 1px; background: var(--bad-soft); }
.forest text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
footer { color: var(--faint); font-size: 12px; padding: 0 0 40px; }
.empty { color: var(--muted); padding: 40px; text-align: center; }

@media (max-width: 980px) {
  .g2, .g4, .hero-grid { grid-template-columns: 1fr; }
  .issue { grid-template-columns: 1fr; }
  .brand .tag { display: none; }
  .metric .num { font-size: 46px; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  header.top .wrap { height: auto; flex-wrap: wrap; gap: 8px; padding-top: 10px; padding-bottom: 10px; }
  nav { margin-left: 0; overflow-x: auto; }
  .tablewrap { overflow-x: auto; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b><span class="mark"></span>Assay</b><span class="tag">Every chip agent says it's done. We prove it.</span></div>
    <nav id="nav">
      <a href="#/overview" data-r="overview">Overview</a>
      <a href="#/issues" data-r="issues">Issues</a>
      <a href="#/runs" data-r="runs">Runs</a>
      <a href="#/tasks" data-r="tasks">Tasks</a>
    </nav>
    <button class="icon-btn" id="theme" title="Toggle theme">Dark</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap" id="foot"></footer>
<script>
const DATA = /*__ASSAY_DATA__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
const pts = x => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(Math.round(x * 100)) + " pts";
const money = x => x == null ? "–" : "$" + (x >= 10 ? x.toFixed(0) : x.toFixed(2));
const S = DATA.summary;
const CFG = Object.fromEntries(DATA.configs.map(c => [c.id, c]));
const RUN = Object.fromEntries(DATA.runs.map(r => [r.run_id, r]));
const DET = DATA.detectors;
const VERDICT = {
  correct: ["good", "Actually correct"], incorrect: ["bad", "Design is wrong"],
  unverified: ["warn", "Unverified (formal inconclusive)"], error: ["neutral", "Run error"],
};
const verdictPill = v => `<span class="pill ${VERDICT[v][0]}"><span class="dot"></span>${VERDICT[v][1]}</span>`;
const claimPill = c => c ? `<span class="pill accent">Said “done”</span>` : `<span class="pill neutral">Did not claim done</span>`;
const cfgLabel = id => esc(CFG[id]?.label || id);

const ICONS = {
  read: '<path d="M2 3h4.5A1.5 1.5 0 0 1 8 4.5V13a1 1 0 0 0-1-1H2zM14 3H9.5A1.5 1.5 0 0 0 8 4.5V13a1 1 0 0 1 1-1h5z"/>',
  edit: '<path d="M10.5 2.5l3 3L6 13H3v-3z"/>',
  sim: '<path d="M5 3l8 5-8 5z"/>',
  bash: '<path d="M3 4l4 4-4 4M8.5 12H13"/>',
  search: '<circle cx="7" cy="7" r="4"/><path d="M10 10l3.5 3.5"/>',
  message: '<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/>',
  tool: '<circle cx="8" cy="8" r="3"/>',
  result: '<path d="M5 8h6"/>',
  pass: '<path d="M3.5 8.5l3 3 6-7"/>',
  fail: '<path d="M4 4l8 8M12 4l-8 8"/>',
};
const icon = k => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.tool}</svg>`;

/* ---------- charts ---------- */
function gapBar(p) {
  const c = (p.claimed_done.rate || 0) * 100, a = (p.actual_pass.rate || 0) * 100;
  const w = (p.wrong_but_finished / Math.max(1, p.runs)) * 100;
  return `<div class="gb-track"><span class="gb-claim" style="width:${c}%"></span><span class="gb-ok" style="width:${a}%"></span>
      <span class="gb-wrong" style="left:${a}%;width:${Math.min(w, 100 - a)}%"></span><span class="gb-mark" style="left:${c}%"></span></div>
    <div class="gb-labels"><span style="color:var(--good)">correct ${pct(a / 100)}</span><span>said done ${pct(c / 100)}</span></div>`;
}

function forest(cmp) {
  const rows = [["Actually correct", cmp.actual_pass], ["Said “done”", cmp.claimed_done], ["Wrong but finished", cmp.wrong_but_finished]];
  const W = 560, L = 150, R = 130, rowH = 34, H = rows.length * rowH + 26;
  const lo = -1, hi = 1, sx = v => L + (v - lo) / (hi - lo) * (W - L - R);
  let g = `<line x1="${sx(0)}" y1="4" x2="${sx(0)}" y2="${H - 20}" stroke="var(--faint)" stroke-dasharray="3 3"/>`;
  [-1, -.5, 0, .5, 1].forEach(t => g += `<text x="${sx(t)}" y="${H - 4}" text-anchor="middle">${t > 0 ? "+" : ""}${t * 100}</text>`);
  rows.forEach(([name, b], i) => {
    const y = 18 + i * rowH;
    if (b.diff == null) return;
    const col = b.significant ? "var(--accent)" : "var(--faint)";
    g += `<text x="0" y="${y + 4}" style="fill:var(--text);font-size:12.5px">${name}</text>
      <line x1="${sx(b.lo)}" y1="${y}" x2="${sx(b.hi)}" y2="${y}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="${sx(b.diff)}" cy="${y}" r="5.5" fill="${col}"/>
      <text x="${W - R + 12}" y="${y + 4}" style="fill:var(--text);font-size:12.5px;font-weight:600">${pts(b.diff)}</text>
      <text x="${W - 2}" y="${y + 4}" text-anchor="end" style="font-size:11px">${b.significant ? "significant" : "not significant"}</text>`;
  });
  return `<svg class="forest" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Config comparison">${g}</svg>`;
}

/* ---------- views ---------- */
function overview() {
  const per = S.per_config, ids = Object.keys(per), T = DATA.trials;
  const hero = ids.map(id => {
    const p = per[id];
    const gap = (p.claimed_done.rate || 0) - (p.actual_pass.rate || 0);
    return `<div class="card">
      <div class="hero-head"><span class="cfg">${cfgLabel(id)}</span><span class="model">${esc(CFG[id].model)}</span></div>
      <div class="pair">
        <div class="metric claimed"><div class="lbl">Said it was done</div><div class="num">${pct(p.claimed_done.rate)}</div>
          <div class="ci">95% CI ${pct(p.claimed_done.lo)}–${pct(p.claimed_done.hi)}</div></div>
        <div class="metric actual"><div class="lbl">Actually correct</div><div class="num">${pct(p.actual_pass.rate)}</div>
          <div class="ci">95% CI ${pct(p.actual_pass.lo)}–${pct(p.actual_pass.hi)}</div></div>
      </div>
      <div class="gapbar">${gapBar(p)}</div>
      <div class="gapnote">${gap > 0 ? `<b>${Math.round(gap * 100)}-point gap.</b> ` : ""}<b>${p.wrong_but_finished}</b> of ${p.runs} runs said “done” and the design was wrong
        ${p.claimed_done.k ? `<span class="muted">(${pct(p.false_claim_share.rate)} of all “done” claims).</span>` : ""}</div>
      <div class="legend"><span><i style="background:var(--good)"></i>Correct (hidden tests + formal)</span><span><i style="background:var(--bad)"></i>Said done, actually wrong</span></div>
    </div>`;
  }).join("");

  const cmp = S.comparison.map(c => `<div class="card">
      <h2>${cfgLabel(c.b)} vs ${cfgLabel(c.a)}</h2>
      <p class="muted small" style="margin:-8px 0 14px">Difference in percentage points, paired by task, 95% bootstrap CI over ${c.actual_pass.n_tasks} tasks. If the interval crosses 0 it is not significant.</p>
      ${forest(c)}
    </div>`).join("");

  const statRow = ids.map(id => {
    const p = per[id];
    return `<tr><td><b>${cfgLabel(id)}</b></td>
      <td class="num-cell">${pct(p.actual_pass.rate)}</td><td class="num-cell">${pct(p.claimed_done.rate)}</td>
      <td class="num-cell">${p.wrong_but_finished}</td>
      <td class="num-cell">${pct(p["pass_hat_" + T].rate)} <span class="faint">(${p["pass_hat_" + T].k}/${p["pass_hat_" + T].n})</span></td>
      <td class="num-cell">${pct(p["pass_at_" + T].rate)} <span class="faint">(${p["pass_at_" + T].k}/${p["pass_at_" + T].n})</span></td>
      <td class="num-cell">${money(p.mean_cost_usd)}</td><td class="num-cell">${p.mean_turns?.toFixed(1) ?? "–"}</td>
      <td class="num-cell">${p.mean_duration_s ? Math.round(p.mean_duration_s) + "s" : "–"}</td></tr>`;
  }).join("");

  const top = S.issues.slice(0, 3).map((i, n) => `<tr class="click" onclick="location.hash='#/issues'">
      <td class="faint">${n + 1}</td><td><b>${esc(i.name)}</b><div class="muted small">${esc(i.description)}</div></td>
      ${ids.map(id => `<td class="num-cell">${i.by_config[id] ?? 0}</td>`).join("")}
      <td><a href="#/run/${i.example.run_id}/${i.example.step_index}" onclick="event.stopPropagation()">Example →</a></td></tr>`).join("");

  return `<h1>Did the agent actually fix the chip?</h1>
    <p class="sub">${S.total_runs} real Claude Code runs on ${S.total_tasks} private Verilog bug-fix tasks (${T} trials per agent).
      Every verdict comes from a hidden testbench (Icarus Verilog) plus formal equivalence against the reference design (Yosys) — not an AI judge.</p>
    <div class="grid hero-grid" style="--n:${ids.length}">${hero}</div>
    <div class="grid g4 section">
      <div class="card stat"><div class="v">${S.total_runs}</div><div class="k">Agent runs graded</div></div>
      <div class="card stat"><div class="v">${S.total_tasks}</div><div class="k">Private tasks</div></div>
      <div class="card stat"><div class="v" style="color:var(--bad)">${S.wrong_but_finished}</div><div class="k">Said “done” but wrong</div></div>
      <div class="card stat"><div class="v">${money(S.total_cost_usd)}</div><div class="k">Total agent cost</div></div>
    </div>
    <div class="grid ${S.comparison.length ? "g2" : ""} section">
      ${cmp}
      <div class="card"><h2>Top issues</h2>
        ${S.issues.length ? `<table><thead><tr><th></th><th>Issue</th>${ids.map(id => `<th class="num-cell">${esc(id)}</th>`).join("")}<th></th></tr></thead><tbody>${top}</tbody></table>` : `<div class="muted">No issues detected.</div>`}
      </div>
    </div>
    <div class="card section tablewrap"><h2>Per-agent detail</h2>
      <table><thead><tr><th>Agent</th><th class="num-cell">Actually correct</th><th class="num-cell">Said done</th><th class="num-cell">Wrong but finished</th>
        <th class="num-cell">pass^${T} (all trials)</th><th class="num-cell">pass@${T} (any trial)</th><th class="num-cell">Mean cost</th><th class="num-cell">Mean turns</th><th class="num-cell">Mean time</th></tr></thead>
      <tbody>${statRow}</tbody></table></div>`;
}

function issues() {
  const ids = Object.keys(S.per_config);
  if (!S.issues.length) return `<h1>Issues</h1><div class="card empty">No detector fired on any run.</div>`;
  const cards = S.issues.map((i, n) => {
    const max = Math.max(...ids.map(id => S.per_config[id].runs));
    const bars = ids.map(id => {
      const r = i.rate_by_config[id];
      return `<div class="cb"><div><div class="row small" style="justify-content:space-between"><span>${cfgLabel(id)}</span><span class="muted">${r.k}/${r.n}</span></div>
        <div class="track"><span style="width:${(r.rate || 0) * 100}%"></span></div></div><div class="num-cell small"><b>${pct(r.rate)}</b></div></div>`;
    }).join("");
    const ex = i.example;
    const list = i.runs.map(r => `<tr><td><a href="#/run/${r.run_id}/${r.step_index}">${esc(r.task)}</a></td><td>${cfgLabel(r.config)}</td>
       <td class="mono small">${esc(r.run_id.split("__").pop())}</td><td><a href="#/run/${r.run_id}/${r.step_index}">step ${r.step_index} →</a></td></tr>`).join("");
    return `<div class="card issue">
      <div class="rank">${n + 1}</div>
      <div style="min-width:0">
        <div class="row"><span class="name">${esc(i.name)}</span><span class="pill ${i.severity === "high" ? "bad" : i.severity === "medium" ? "warn" : "neutral"}">${i.severity}</span>
          <span class="muted small">${i.count} run${i.count === 1 ? "" : "s"} · ${i.tasks.length} task${i.tasks.length === 1 ? "" : "s"}</span></div>
        <div class="desc">${esc(i.description)}</div>
        <div class="small muted" style="margin-bottom:6px">Example: <b style="color:var(--text)">${esc(ex.task)}</b> · ${cfgLabel(ex.config)} ·
          <a href="#/run/${ex.run_id}/${ex.step_index}">Jump to step ${ex.step_index} →</a></div>
        <div class="evidence"><pre>${esc(ex.evidence)}</pre></div>
        <details style="margin-top:10px"><summary>All ${i.count} flagged runs</summary>
          <div class="tablewrap"><table style="margin-top:6px"><tbody>${list}</tbody></table></div></details>
      </div>
      <div class="countbars">${bars}</div>
    </div>`;
  }).join('<div style="height:14px"></div>');
  return `<h1>Issues</h1><p class="sub">Failure patterns found by rule-based detectors over every transcript and workspace diff, ranked by how often they occur. Each one links to the exact step in the trace.</p>${cards}`;
}

let runFilter = {config: "", verdict: "", det: "", claimed: ""};
function runs() {
  const sel = (k, opts) => `<select data-k="${k}">${opts.map(([v, l]) => `<option value="${v}" ${runFilter[k] === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const rs = DATA.runs.filter(r => (!runFilter.config || r.config === runFilter.config) && (!runFilter.verdict || r.verdict === runFilter.verdict)
    && (!runFilter.det || r.detections.some(d => d.detector === runFilter.det))
    && (!runFilter.claimed || String(r.claimed_done) === runFilter.claimed));
  const rows = rs.map(r => `<tr class="click" onclick="location.hash='#/run/${r.run_id}'">
      <td><b>${esc(r.task)}</b></td><td>${cfgLabel(r.config)}</td><td class="num-cell">${r.trial}</td>
      <td>${r.claimed_done ? "Yes" : '<span class="muted">No</span>'}</td><td>${verdictPill(r.verdict)}</td>
      <td>${r.detections.map(d => `<span class="chip ${DET[d.detector].severity === "high" ? "flag" : ""}">${esc(DET[d.detector].name)}</span>`).join("") || '<span class="faint">–</span>'}</td>
      <td class="num-cell">${r.turns ?? "–"}</td><td class="num-cell">${money(r.cost_usd)}</td></tr>`).join("");
  return `<h1>Runs</h1><p class="sub">Every agent run, graded. Click a run to see its full timeline.</p>
    <div class="card tablewrap"><div class="row filters" style="margin-bottom:12px">
      ${sel("config", [["", "All agents"], ...DATA.configs.map(c => [c.id, c.label])])}
      ${sel("verdict", [["", "All verdicts"], ...Object.entries(VERDICT).map(([k, v]) => [k, v[1]])])}
      ${sel("claimed", [["", "Claimed done: any"], ["true", "Said done"], ["false", "Did not claim"]])}
      ${sel("det", [["", "Any issue"], ...Object.entries(DET).map(([k, v]) => [k, v.name])])}
      <span class="spacer"></span><span class="muted small">${rs.length} runs</span></div>
    <table><thead><tr><th>Task</th><th>Agent</th><th class="num-cell">Trial</th><th>Said done</th><th>Verdict</th><th>Issues</th><th class="num-cell">Turns</th><th class="num-cell">Cost</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="8" class="empty">No runs match.</td></tr>`}</tbody></table></div>`;
}

function diffHtml(d) {
  return d.split("\n").map(l => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "add" : l.startsWith("-") && !l.startsWith("---") ? "del" : l.startsWith("@@") ? "hunk" : ""}">${esc(l)}</span>`).join("\n");
}

function runView(id, target) {
  const r = RUN[id];
  if (!r) return `<div class="card empty">Run not found: ${esc(id)}</div>`;
  const flagsAt = {};
  r.detections.forEach(d => (flagsAt[d.step_index] ||= []).push(d));
  const steps = r.steps.map(s => {
    const cat = s.kind === "assistant" ? "message" : s.category;
    const simCls = s.sim_status ? ` sim-${s.sim_status}` : "";
    const ic = s.kind === "tool_result" ? (s.sim_status === "pass" ? "pass" : s.sim_status === "fail" ? "fail" : "result") : cat;
    const fl = flagsAt[s.i] || [];
    const badge = s.sim_status === "pass" ? ` <span class="pill good">pass</span>` : s.sim_status === "fail" ? ` <span class="pill bad">fail</span>` : "";
    const hasDetail = s.detail && s.detail.trim() && s.detail.trim() !== s.summary.trim();
    return `<div class="step ${s.kind} cat-${cat}${simCls}${fl.length ? " flagged" : ""}${target === s.i ? " target" : ""}" id="step-${s.i}">
      <div class="t">+${s.t.toFixed(1)}s</div><div class="ico">${icon(ic)}</div>
      <div class="body"><div class="sum"><span class="idx">#${s.i}</span>${s.kind === "tool_call" && s.tool ? `<b>${esc(s.tool)}</b> ` : ""}${esc(s.kind === "tool_call" && s.tool && s.summary.startsWith(s.tool) ? s.summary.slice(s.tool.length).trim() : s.summary)}${badge}</div>
        ${hasDetail ? `<details ${fl.length && s.kind !== "assistant" ? "open" : ""}><summary>${s.kind === "assistant" ? "Full message" : "Details"}</summary><pre>${esc(s.detail)}</pre></details>` : ""}
        ${fl.map(d => `<div class="flagbox"><div class="ttl">${esc(DET[d.detector].name)}</div><div class="small muted" style="margin-bottom:6px">${esc(DET[d.detector].description)}</div><pre>${esc(d.evidence)}</pre></div>`).join("")}
      </div></div>`;
  }).join("");
  const eq = r.equiv || {};
  const eqTxt = {proven: "Proven equivalent to reference", failed: "Not equivalent (counterexample found)", unknown: "Inconclusive", "n/a": "Not applicable for this task", skipped: "Skipped (hidden simulation failed)"}[eq.result] || eq.result;
  return `<div class="small muted" style="margin-bottom:10px"><a href="#/runs">← All runs</a></div>
    <div class="card"><div class="runhead"><div style="flex:1;min-width:260px">
      <h1 style="margin-bottom:2px">${esc(r.task)}</h1><div class="muted">${cfgLabel(r.config)} · trial ${r.trial} · <span class="mono small">${esc(r.run_id)}</span></div>
      <div class="kv"><div>Turns<b>${r.turns ?? "–"}</b></div><div>Cost<b>${money(r.cost_usd)}</b></div><div>Wall time<b>${r.duration_s ?? "–"}s</b></div>
        <div>Ended<b>${esc({finished: "Normally", max_turns: "Hit max turns", timeout: "Timed out", crash: "Crashed"}[r.status])}</b></div>
        <div>Files changed<b class="mono" style="font-size:13px">${esc(r.files_changed.join(", ") || "none")}</b></div></div></div>
      <div class="row" style="align-self:flex-start">${claimPill(r.claimed_done)}${verdictPill(r.verdict)}</div></div></div>
    <div class="grid g2 section">
      <div class="card"><h2>What the agent said</h2>${r.claim_text ? `<div class="evidence neutral"><pre>“${esc(r.claim_text)}”</pre></div>` : ""}
        <details style="margin-top:10px"><summary>Full final message</summary><pre style="margin-top:6px">${esc(r.final_text)}</pre></details></div>
      <div class="card"><h2>What the grader found</h2>
        <div class="row" style="margin-bottom:8px"><span class="pill ${r.hidden_sim.passed ? "good" : "bad"}">Hidden testbench: ${r.hidden_sim.passed ? "pass" : "fail"}</span>
          <span class="pill ${eq.result === "proven" ? "good" : eq.result === "failed" ? "bad" : "neutral"}">Formal: ${esc(eqTxt)}</span></div>
        <details><summary>Hidden simulation log</summary><pre style="margin-top:6px">${esc(r.hidden_sim.output_tail)}</pre></details>
        ${eq.note ? `<details><summary>Formal check notes</summary><pre style="margin-top:6px">${esc(eq.note)}</pre></details>` : ""}</div>
    </div>
    ${r.detections.length ? `<div class="card section"><h2>Issues in this run</h2>${r.detections.map(d => `<div class="row" style="margin-bottom:6px"><span class="chip flag">${esc(DET[d.detector].name)}</span><span class="muted small">${esc(DET[d.detector].description)}</span><a class="small" href="#/run/${r.run_id}/${d.step_index}">step ${d.step_index} →</a></div>`).join("")}</div>` : ""}
    <div class="card section"><h2>Timeline</h2><div class="timeline">${steps}</div></div>
    <div class="card section"><h2>Final diff</h2>${r.diff ? `<pre class="diff">${diffHtml(r.diff)}</pre>` : `<div class="muted">No changes.</div>`}</div>`;
}

function tasks() {
  const ids = DATA.configs.map(c => c.id);
  const rows = DATA.tasks.map(t => `<tr><td><b>${esc(t.id)}</b><div class="muted small">${esc(t.bug_description || "")}</div></td>
      <td>${esc(t.difficulty)}</td><td><span class="chip">${esc(t.bug_type)}</span></td>
      <td>${t.visible_tb_weak ? '<span class="pill warn">misses injected bug</span>' : '<span class="pill neutral">catches injected bug</span>'}</td>
      <td class="num-cell">${t.trust && t.trust.trust != null ? `<b>${pct(t.trust.trust)}</b> <span class="faint small">(${t.trust.visible_catches}/${t.trust.real_bugs})</span>` : '<span class="faint">–</span>'}</td>
      ${ids.map(id => { const x = t.results[id]; return `<td><div class="row"><span class="trials">${x.runs.map(r => `<a href="#/run/${r.run_id}" class="${r.verdict}${r.claimed_done ? " claimed" : ""}" title="trial ${r.run_id.split("__t").pop()}: ${VERDICT[r.verdict][1]}${r.claimed_done ? ", said done" : ""}"></a>`).join("")}</span><b class="small">${x.correct}/${x.n}</b></div></td>`; }).join("")}</tr>`).join("");
  return `<h1>Tasks</h1><p class="sub">Private bug-fix tasks built from small RTL designs. Each square is one trial: green = actually correct, red = wrong, outlined red = said “done” but wrong. <b>Visible test trust</b> is a mutation score: of the real bugs we injected into the reference design (ones the hidden testbench catches), the share the agent-visible testbench also catches.</p>
    <div class="card tablewrap"><table><thead><tr><th>Task</th><th>Difficulty</th><th>Bug type</th><th>Visible test</th><th class="num-cell" title="Share of mutant bugs (killed by the hidden testbench) that the visible testbench also catches">Visible test trust</th>${ids.map(id => `<th>${cfgLabel(id)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- router ---------- */
function route() {
  const parts = (location.hash || "#/overview").slice(2).split("/");
  const view = parts[0] || "overview";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.r === view || (view === "run" && a.dataset.r === "runs")));
  const app = $("#app");
  if (view === "issues") app.innerHTML = issues();
  else if (view === "runs") app.innerHTML = runs();
  else if (view === "tasks") app.innerHTML = tasks();
  else if (view === "run") {
    const target = parts[2] !== undefined && parts[2] !== "" && parts[2] !== "null" ? +parts[2] : null;
    app.innerHTML = runView(decodeURIComponent(parts[1]), target);
    const noScroll = new URLSearchParams(location.search).has("noscroll");  // full-page screenshots
    if (target !== null && !noScroll) { const el = document.getElementById("step-" + target); if (el) { el.scrollIntoView({block: "center"}); return; } }
  } else app.innerHTML = overview();
  window.scrollTo(0, 0);
}
document.addEventListener("change", e => {
  if (e.target.matches(".filters select")) { runFilter[e.target.dataset.k] = e.target.value; route(); }
});
window.addEventListener("hashchange", route);

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("#theme").textContent = t === "dark" ? "Light" : "Dark";
  try { localStorage.setItem("assay-theme", t); } catch (e) {}
}
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
try { const t = localStorage.getItem("assay-theme"); if (t) setTheme(t); } catch (e) {}
if (new URLSearchParams(location.search).get("theme")) setTheme(new URLSearchParams(location.search).get("theme"));

$("#foot").innerHTML = `Generated ${esc(DATA.generated_at)} from <span class="mono">results/results.json</span>. All numbers come from real agent runs; nothing is hand-entered.
  Agent prompt: <span class="mono">${esc(DATA.base_prompt)}</span>`;
route();
</script>
</body>
</html>
